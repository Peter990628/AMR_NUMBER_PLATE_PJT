observation_candidate_stabilizer:
  ros__parameters:
    use_sim_time: true
    input_topic: /observation_candidates/raw
    output_topic: /observation_candidates
    marker_topic: /debug/observation_candidates
    expected_frame: observation_lidar
    fixed_frame: odom
    confirmation_count: 3
    # Consistency bounds on BOTH candidate positions and observed endpoints.
    # Checks use exact-source-stamp fixed-frame TF. No averaging/held output.
    max_position_delta_m: 0.15
    max_yaw_delta_deg: 3.0
    max_source_gap_sec: 0.35
    input_timeout_sec: 1.0
    max_input_age_sec: 0.5
    future_tolerance_sec: 0.1
    tf_wait_timeout_sec: 0.2
